name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check formatting
        run: uvx ruff@0.6.3 format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      # Tests download the pinned CCD snapshot from the Hugging Face Hub
      # (artios/assets.py); cache it across runs, keyed on its revision.
      - name: Cache Hugging Face downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-ccd-${{ hashFiles('artios/assets.py') }}

      - name: Run fast tests
        env:
          # Needed while the Hugging Face repositories are private.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run pytest -m "not slow"

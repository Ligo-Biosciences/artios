name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.artios
          target: artios-ci
          load: true
          tags: artios:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run fast tests
        run: docker run --rm artios:ci pytest -m "not slow"

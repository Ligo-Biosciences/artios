name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check formatting
        run: uvx ruff@0.6.3 format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Cache CCD data
        id: ccd-cache
        uses: actions/cache@v4
        with:
          path: ccd_files/
          key: ccd-20241126

      - name: Download CCD data
        if: steps.ccd-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ccd_files
          gh release download ccd-20241126 \
            --repo ${{ github.repository }} \
            --pattern 'components.cif.gz' \
            --pattern 'components.cif.rdkit_mol.pkl.gz' \
            --dir ccd_files/
          gunzip ccd_files/components.cif.gz
          gunzip ccd_files/components.cif.rdkit_mol.pkl.gz

      - name: Run fast tests
        run: uv run pytest -m "not slow"

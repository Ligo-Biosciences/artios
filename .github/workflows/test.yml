name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  BASE_IMAGE_TAG: ghcr.io/ligo-biosciences/artios-all-atom/base:latest

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Cache CCD data
        id: ccd-cache
        uses: actions/cache@v4
        with:
          path: ccd_files/
          key: ccd-20241126

      - name: Download CCD data
        if: steps.ccd-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ccd_files
          gh release download ccd-20241126 \
            --repo ${{ github.repository }} \
            --pattern 'components.cif.gz' \
            --pattern 'components.cif.rdkit_mol.pkl.gz' \
            --dir ccd_files/
          gunzip ccd_files/components.cif.gz
          gunzip ccd_files/components.cif.rdkit_mol.pkl.gz

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CI image
        run: |
          if docker pull "${BASE_IMAGE_TAG}"; then
            echo "Using pre-built base image from GHCR"
            BUILD_ARG="BASE_IMAGE=${BASE_IMAGE_TAG}"
          else
            echo "::notice::Base image not found on GHCR — building from scratch as a fallback."
            echo "::notice::Trigger the 'Build base image' workflow to populate the cache."
            BUILD_ARG="BASE_IMAGE=base"
          fi
          docker build \
            --target ci \
            --build-arg "${BUILD_ARG}" \
            -f Dockerfile.artios \
            -t artios:ci .

      - name: Run fast tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/ccd_files:/app/ccd_files:ro" \
            artios:ci pytest -m "not slow"

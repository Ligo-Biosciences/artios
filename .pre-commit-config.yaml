---
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.6.3
    hooks:
      # Run the linter.
      - id: ruff
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/johannsdg/pre-commit-license-headers
    rev: v0.1.0
    hooks:
      - id: check-license-headers
        args:
          - "--template"
          - |
            Copyright (c) [YEARS] Ligo Biosciences, Inc.
            All rights reserved.
          # - "--owner=The Pre-Commit License Headers Authors"
        include: .*py
        exclude: |
          (?x)^(
            .pre-commit-config.yaml|
            .pre-commit-hooks.yaml|
            Dockerfile.artios|
            LICENSE|
            README.md|
            requirements.in|
            ruff.toml|
            artios/data/constants.py|
            pyproject.toml|
            .*\.txt
          )$
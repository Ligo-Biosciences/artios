repos:
  # Built-in hooks for common issues
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace        # Remove trailing whitespace
      - id: end-of-file-fixer         # Ensure files end with newline
      - id: check-yaml                # Check YAML syntax
      - id: check-json                # Check JSON syntax
      - id: check-toml                # Check TOML syntax
      - id: check-added-large-files   # Prevent large files from being committed
        args: ['--maxkb=1000']        # Max 1MB files
      - id: check-merge-conflict      # Check for merge conflict markers
      - id: debug-statements          # Check for debugger imports

  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=88]

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=88]

  # Basic linting (less strict)
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [
          --max-line-length=88,
          --extend-ignore=E203,W503,E501,F401,F403,F811,E402
        ]
        exclude: ^protenix/openfold_local/

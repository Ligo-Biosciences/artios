[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artios"
version = "0.0.1"
description = "Ligo's SOTA ligand-binding protein generator."
readme = "README.md"
license = {text = "All rights reserved."}
authors = [
    {name = "Arda Goreci", email = "arda@ligo.bio"},
    {name = "Oliver J. Cort", email = "oli@ligo.bio"}
]
maintainers = [
    {name = "Arda Goreci", email = "arda@ligo.bio"},
    {name = "Oliver J. Cort", email = "oli@ligo.bio"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11"
dependencies = [
    "PyYaml",
    "scipy",
    "pytest",
    "ml_collections",
    "tqdm",
    "pandas",
    "rdkit",
    "biopython>=1.83",
    "rootutils",
    "posebusters",
    "biotite>=1.2.0",
    "protobuf==3.20.2",
    "seaborn",
    "icecream",
    "neptune-scale",
    "ninja",
    "setuptools",
    "numpy>=1.26.3,<3.0.0",
    "dm-tree",
    "numba>=0.60",
    "matplotlib>=3.9.2",
    "scikit-learn>=1.7.2,<1.8",
    "torch>=2.3.1",
    "pre-commit",
    "modal==1.2.3",
    "boto3",
    "lz4",
    "peppr",
    "jaxtyping",
    "pocketeer[dev]==0.0.4",
    "ray>=2.48.0",
    "polars>=1.35.2",
    "rapidgzip>=0.15.2",
    "beartype>=0.22.6",
    "pydantic==2.12.3",
    "einops>=0.8.1",
    "streamlit",
    "trambio>=1.0.3",
    "pymol-remote>=1.1.0",
    "pdb2pqr",
    "GridDataFormats",
    "wandb>=0.25.0",
    "pandera>=0.29.0",
    "ipywidgets>=8.1.8",
]

[project.optional-dependencies]
engineering = [
    "foldcomp>=1.0.0",
    "xgboost>=3.2.0",
]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "pre-commit",
    "ipykernel",
    "notebook",
]
train-bot = [
    "slack-bolt>=1.21",
    "claude-agent-sdk>=0.1.66",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/Ligo-Biosciences/artios-ligand"
Repository = "https://github.com/Ligo-Biosciences/artios-ligand"
"Bug Tracker" = "https://github.com/Ligo-Biosciences/artios-ligand/issues"


[tool.setuptools.packages.find]
exclude = ["assets*", "benchmark*", "*.egg-info*", "tests*"]

[tool.setuptools.package-data]
"artios" = ["model/layer_norm/kernel/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--disable-warnings",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ty.src]
exclude = ["tests/"]

[tool.uv]
no-binary-package = ["atomworks"]

[tool.ty.environment]
python = ".venv"

[tool.ty.rules]
# Ignore nn.Module custom __setattr__ complaints for self.x = x patterns
unresolved-attribute = "ignore"

[[tool.ty.overrides]]
# features.py uses Feature(), Label(), etc. as type constructors that return Annotated types.
# This pattern works at runtime but violates static typing rules.
include = ["artios/data/features.py"]

[tool.ty.overrides.rules]
invalid-type-form = "ignore"

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "ty>=0.0.1a27",
]

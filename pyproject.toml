[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artios"
version = "0.0.1"
description = "Generative models for ligand-binding protein design: all-atom motif scaffolding and sequence design."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Arda Goreci", email = "arda@ligo.bio"},
    {name = "Oliver J. Cort", email = "oli@ligo.bio"}
]
maintainers = [
    {name = "Arda Goreci", email = "arda@ligo.bio"},
    {name = "Oliver J. Cort", email = "oli@ligo.bio"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11,<3.13"
# Core dependencies: everything needed to import `artios` and run inference.
dependencies = [
    "torch>=2.3.1",
    "numpy>=1.26.3,<3.0.0",
    "scipy",
    "pandas",
    "biotite>=1.2.0",
    "rdkit",
    "networkx",
    "einops>=0.8.1",
    "jaxtyping",
    "beartype>=0.22.6",
    "typing_extensions",
    "pydantic>=2.12.3,<3",
    "ml_collections",
    "PyYaml",
    "tqdm",
    # Pinned below 1.8 so the bundled pocket classifiers (joblib) unpickle.
    "scikit-learn>=1.7.2,<1.8",
]

[project.optional-dependencies]
# Training (artios/runner/train_*.py).
train = [
    "wandb>=0.25.0",
    "neptune-scale",
    "pandera>=0.29.0",
    "rootutils",
]
# Training-data preparation (scripts/data/, pocket annotation).
data = [
    "pocketeer==0.0.4",
    "ray>=2.48.0",
    "polars>=1.35.2",
    "psutil",
    "gemmi",
    "pdbeccdutils",
]
# Structure-quality and electrostatics metrics (artios/metrics, artios/electrostatics).
metrics = [
    "peppr",
    "numba>=0.60",
    "pdb2pqr",
    "GridDataFormats",
]

[project.urls]
Homepage = "https://github.com/Ligo-Biosciences/artios"
Repository = "https://github.com/Ligo-Biosciences/artios"
"Bug Tracker" = "https://github.com/Ligo-Biosciences/artios/issues"

[tool.setuptools.packages.find]
include = ["artios*"]

[tool.setuptools.package-data]
"artios" = ["data/pocket/*.joblib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--disable-warnings",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ty.src]
exclude = ["tests/"]

[tool.ty.environment]
python = ".venv"

[tool.ty.rules]
# Ignore nn.Module custom __setattr__ complaints for self.x = x patterns
unresolved-attribute = "ignore"

[[tool.ty.overrides]]
# features.py uses Feature(), Label(), etc. as type constructors that return Annotated types.
# This pattern works at runtime but violates static typing rules.
include = ["artios/data/features.py"]

[tool.ty.overrides.rules]
invalid-type-form = "ignore"

[dependency-groups]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "pre-commit",
    "ruff",
    "matplotlib>=3.9.2",
    "ty>=0.0.1a27",
]

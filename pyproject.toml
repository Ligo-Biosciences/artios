[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artios"
version = "0.0.1"
description = "Ligo's SOTA ligand-binding protein generator."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Arda Goreci", email = "arda@ligo.bio"},
    {name = "Oliver J. Cort", email = "oli@ligo.bio"}
]
maintainers = [
    {name = "Arda Goreci", email = "arda@ligo.bio"},
    {name = "Oliver J. Cort", email = "oli@ligo.bio"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11"
dependencies = [
    "PyYaml",
    "scipy",
    "pytest",
    "ml_collections",
    "tqdm",
    "pandas",
    "optree",
    "rdkit",
    "biopython>=1.83",
    "rootutils",
    "posebusters",
    "modelcif==0.7",
    "biotite>=1.2.0,<1.3.0",
    "protobuf==3.20.2",
    "seaborn",
    "icecream",
    "neptune-scale",
    "ninja",
    "setuptools",
    "numpy>=1.26.3,<3.0.0",
    "dm-tree",
    "matplotlib>=3.9.2",
    "scikit-learn>=1.6.1",
    "torch>=2.3.1",
    "pre-commit",
    "modal",
    "boto3",
    "peppr",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
    "mypy",
    "pre-commit",
]

[project.urls]
Homepage = "https://github.com/Ligo-Biosciences/artios-ligand"
Repository = "https://github.com/Ligo-Biosciences/artios-ligand"
"Bug Tracker" = "https://github.com/Ligo-Biosciences/artios-ligand/issues"


[tool.setuptools.packages.find]
exclude = ["assets*", "benchmark*", "*.egg-info*", "tests*"]

[tool.setuptools.package-data]
"protenix" = ["model/layer_norm/kernel/*"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["protenix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--disable-warnings",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "rdkit.*",
    "ml_collections.*",
    "dm_tree.*",
    "wandb.*",
    "biotite.*",
    "deepspeed.*",
]
ignore_missing_imports = true
